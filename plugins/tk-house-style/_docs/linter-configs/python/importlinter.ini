# tk-house-style: import-linter contracts.
# Copy to project root as `.importlinter` or `importlinter.ini`,
# then run: lint-imports --config importlinter.ini
#
# Replace `myproject` below with your top-level package name.

[importlinter]
root_packages =
    myproject

# ---------------------------------------------------------------------
# Layered: core <- shell <- app  (top depends on lower; lower never on top)
# ---------------------------------------------------------------------
[importlinter:contract:layered]
name = Functional core / imperative shell / app composition layers
type = layers
layers =
    myproject.app
    myproject.shell
    myproject.core
containers =
    myproject

# ---------------------------------------------------------------------
# Forbidden: core must not pull in I/O / framework modules.
# ---------------------------------------------------------------------
[importlinter:contract:core-purity]
name = Core must not import I/O, frameworks, or impure stdlib modules
type = forbidden
source_modules =
    myproject.core
forbidden_modules =
    os
    sys
    socket
    subprocess
    threading
    asyncio
    http
    urllib
    requests
    httpx
    sqlite3
    sqlalchemy
    fastapi
    flask
    django
    boto3
    redis
    myproject.shell
    myproject.app
ignore_imports =

# ---------------------------------------------------------------------
# Independence: feature packages should not cross-import.
# ---------------------------------------------------------------------
[importlinter:contract:feature-independence]
name = Feature packages are independent of one another
type = independence
modules =
    myproject.features.billing
    myproject.features.auth
    myproject.features.notifications
