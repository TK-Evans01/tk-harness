# Drop these tables into the project's `pyproject.toml` if you prefer
# everything in one file instead of separate ruff.toml / mypy.ini.
# This is a SNIPPET — merge with your existing pyproject.

[tool.ruff]
target-version = "py311"
line-length    = 100
src            = ["src", "tests"]

[tool.ruff.lint]
select = [
  "ANN", "B", "C90", "E", "F", "I", "N", "PERF", "PIE",
  "PL", "PT", "PTH", "RET", "RUF", "S", "SIM", "TID", "UP", "W",
]
ignore = ["D", "TRY002", "ANN101", "ANN102", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py"     = ["ANN", "S", "PLR2004", "PLR0915", "B011"]
"**/conftest.py"    = ["ANN"]
"__init__.py"       = ["F401"]
"src/shell/**/*.py" = ["S", "PERF"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args           = 6
max-public-methods = 12
max-statements     = 40

[tool.ruff.format]
quote-style  = "double"
indent-style = "space"

[tool.mypy]
python_version              = "3.11"
strict                      = true
warn_unreachable            = true
warn_redundant_casts        = true
warn_unused_ignores         = true
warn_return_any             = true
warn_unused_configs         = true
disallow_any_generics       = true
disallow_any_decorated      = true
disallow_subclassing_any    = true
no_implicit_optional        = true
strict_optional             = true
disallow_untyped_defs       = true
disallow_incomplete_defs    = true
disallow_untyped_decorators = true
disallow_untyped_calls      = true
check_untyped_defs          = true
show_error_codes            = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs       = false
disallow_incomplete_defs    = false
disallow_untyped_decorators = false

[tool.importlinter]
root_packages = ["myproject"]
