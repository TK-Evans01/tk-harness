# tk-house-style: mypy strict config.
# Run:  mypy --config-file mypy.strict.ini src

[mypy]
python_version          = 3.11
strict                  = True
warn_unreachable        = True
warn_redundant_casts    = True
warn_unused_ignores     = True
warn_return_any         = True
warn_unused_configs     = True

# No Any leaks.
disallow_any_unimported = True
disallow_any_expr       = False
disallow_any_decorated  = True
disallow_any_explicit   = False
disallow_any_generics   = True
disallow_subclassing_any = True

# No implicit Optional.
no_implicit_optional    = True
strict_optional         = True

# Tighten function signatures.
disallow_untyped_defs       = True
disallow_incomplete_defs    = True
disallow_untyped_decorators = True
disallow_untyped_calls      = True
check_untyped_defs          = True

# Output.
show_error_codes        = True
show_column_numbers     = True
pretty                  = True

# Plugin slots — uncomment per project as needed.
# plugins = pydantic.mypy

# ---- Per-module relaxations ----------------------------------------

[mypy-tests.*]
disallow_untyped_defs       = False
disallow_incomplete_defs    = False
disallow_untyped_decorators = False

# Third-party libs without stubs: list them here, do not blanket-ignore.
# [mypy-some_legacy_lib.*]
# ignore_missing_imports = True
